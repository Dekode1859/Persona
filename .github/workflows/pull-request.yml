name: Pull request validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  resolve-and-check:
    name: Resolve dependencies and validate Spiritus bundle
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve locked dependencies with uv
        run: uv sync --locked

      - name: Validate Spiritus bundle configuration
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from spiritus.bundle_config import check_environment, load_bundle_config

          root = Path.cwd()
          config = load_bundle_config(
              root / "spiritus.bundle.toml",
              project_root=root,
              defer_resource_validation=True,
          )
          missing = check_environment(config)
          if missing:
              raise SystemExit("Missing Spiritus prerequisites: " + "; ".join(missing))
          print(f"Spiritus bundle configuration is valid for Persona {config.spec.version}")
          PY

      - name: Run Persona tests
        run: uv run --with pytest python -m pytest -q
