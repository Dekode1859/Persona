name: Pull request validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  resolve-and-check:
    name: Resolve dependencies and validate Spiritus bundle
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve locked dependencies with uv
        run: uv sync --locked

      - name: Validate Spiritus bundle configuration
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import tomllib

          from spiritus.bundle_config import check_environment, load_bundle_config

          root = Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          for config_path in (root / "spiritus.bundle.toml", root / "spiritus.bundle.dev.toml"):
              config = load_bundle_config(
                  config_path,
                  project_root=root,
                  defer_resource_validation=True,
              )
              # The verify executable is generated by the release bundle step;
              # this PR check intentionally validates the pre-build environment.
              missing = [
                  item for item in check_environment(config)
                  if not item.startswith("verify command ")
              ]
              if missing:
                  raise SystemExit(
                      f"Missing Spiritus prerequisites for {config_path.name}: "
                      + "; ".join(missing)
                  )
              if config_path.name == "spiritus.bundle.dev.toml":
                  expected = project["project"]["version"] + "-dev"
                  if config.spec.version != expected:
                      raise SystemExit(
                          f"Development bundle version is {config.spec.version!r}; "
                          f"expected {expected!r}"
                      )
              print(
                  f"Spiritus bundle configuration is valid for "
                  f"{config.spec.name} {config.spec.version} ({config.spec.app_id})"
              )
          PY

      - name: Run Persona tests
        run: uv run --with pytest python -m pytest -q
