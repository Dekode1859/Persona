name: Build and release Persona

on:
  push:
    # Keep master temporarily because the repository currently uses it; main
    # is the intended long-term release branch.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build EXE bundle and installer
        shell: powershell
        run: .\packaging\build-windows.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: persona-windows
          path: release/Persona-Setup-*.exe
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Build macOS app and DMG
        run: bash packaging/build-macos.sh

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: persona-macos
          path: release/Persona-*-macos.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: persona-windows
          path: release

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: persona-macos
          path: release

      - name: Create tagged release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -n 1)"
          TAG="v${VERSION}"
          NOTES="Persona ${VERSION} desktop release. Includes the Windows installer and macOS DMG."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/Persona-Setup-*.exe \
              release/Persona-*-macos.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Persona ${VERSION}" \
              --notes "$NOTES" \
              --latest=false
          else
            gh release create "$TAG" \
              release/Persona-Setup-*.exe \
              release/Persona-*-macos.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Persona ${VERSION}" \
              --notes "$NOTES" \
              --latest=false
          fi
