# Development bundle specification. This installs beside production Persona.
format = 1
platforms = ["windows", "macos"]
entrypoint = "main_dev.py"
name = "PersonaDev"
app_id = "persona-dev"
version = "0.1.6-dev"
console = false
bundle_identifier = "com.dekode.persona.dev"

datas = [
  "ui=ui",
  "schemas=schemas",
  "opencode.json=.",
  "spiritus.bundle.dev.toml=spiritus.bundle.toml",
  "scanner/linkedin_scan.py=scanner",
  "packaging/build-assets/ms-playwright=ms-playwright",
]
binaries = [
  "packaging/build-assets/engine/{engine_binary}=engine",
]
collect_packages = ["playwright", "pypdf", "webview"]
hidden_imports = []

[runtime_env_paths]
PLAYWRIGHT_BROWSERS_PATH = "ms-playwright"

[seed_files]
"opencode.json" = "opencode.json"

[updates]
enabled = true
channel = "stable"
versioning = "semver"

[updates.source]
type = "github"
repository = "Dekode1859/Persona"

[updates.assets]
windows_x86_64 = "Persona-Setup-{version}.exe"
macos_x86_64 = "Persona-{version}-macos.dmg"
macos_arm64 = "Persona-{version}-macos.dmg"

[hooks]
prepare = ["uv", "run", "python", "packaging/prepare-assets.py"]
verify = ["{executable}", "--check-bundle"]
