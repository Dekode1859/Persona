[project]
name = "persona"
version = "0.1.0"
description = "Persona - a Spiritus application for profile, job tracking, and tailored applications"
requires-python = ">=3.11"
dependencies = [
    # Spiritus supplies the runtime; Persona owns Playwright browser workflows.
    "spiritus",
    "playwright>=1.40.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
spiritus = { path = "../spiritus", editable = true }
