[project]
name = "persona"
version = "0.1.4"
description = "Persona - a Spiritus application for profile, job tracking, and tailored applications"
requires-python = ">=3.11"
dependencies = [
    # Spiritus supplies the runtime; Persona owns Playwright browser workflows.
    "spiritus[bundle] @ git+https://github.com/Dekode1859/Spiritus.git@v0.0.35",
    "playwright>=1.40.0",
    "jsonschema>=4.0.0",
    "pypdf>=5.0.0",
]

[tool.uv]
package = false
