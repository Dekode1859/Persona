[project]
name = "persona"
version = "0.1.0"
description = "Persona - a Spiritus application for profile, job tracking, and tailored applications"
requires-python = ">=3.11"
dependencies = [
    # Spiritus supplies the runtime; Persona owns Playwright browser workflows.
    "spiritus @ git+https://github.com/Dekode1859/Spiritus.git@v0.0.2",
    "playwright>=1.40.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false
